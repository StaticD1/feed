<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Feed</title>
</head>
<body>
    <h1>Feed</h1>
    {{if .LoggedIn}}
    <form method="post" action="/posts">
        <textarea name="body" required></textarea><br>
        <button type="submit">Post</button>
    </form>
    {{else}}
    <p><a href="/login">Log in</a> to create a post.</p>
    {{end}}

    {{range .Posts}}
    <article>
        <h2>{{.Username}}</h2>
        {{if .CreatedAt.Valid}}
        <p><time datetime="{{.CreatedAt.Time.UTC.Format "2006-01-02T15:04:05Z07:00"}}">{{.CreatedAt.Time.UTC.Format "Mon, 02.01.2006 15:04 UTC"}}</time></p>
        {{else}}
        <p>Creation time unknown</p>
        {{end}}
        <p>{{.Body}}</p>
    </article>
    {{else}}
    <p>No posts yet.</p>
    {{end}}
</body>
</html>
